
id = "mkiin/wallpaper-picker"
name = "Wallpaper Picker"
version = "0.1.3"
plugin_api = 31
author = "mkiin"
license = "MIT"
tags = ["wallpaper", "video", "theme"]
icon = "photo"
description = "Image and video wallpaper picker with V4-style UI and palette-synced favorites."
dependencies = ["mpv", "mpvpaper"]

[[setting]]
key = "image_directory"
type = "folder"
label_key = "settings.image_directory.label"
description_key = "settings.image_directory.description"
default = ""

[[setting]]
key = "video_directory"
type = "folder"
label_key = "settings.video_directory.label"
description_key = "settings.video_directory.description"
default = ""

[[setting]]
key = "show_names"
type = "bool"
label_key = "settings.show_names.label"
description_key = "settings.show_names.description"
default = true

[[setting]]
key = "mute"
type = "bool"
label_key = "settings.mute.label"
default = true

[[setting]]
key = "hardware_decode"
type = "bool"
label_key = "settings.hardware_decode.label"
description_key = "settings.hardware_decode.description"
default = true

[[setting]]
key = "auto_pause"
type = "select"
label_key = "settings.auto_pause.label"
description_key = "settings.auto_pause.description"
default = "full"
options = [
  { value = "off", label_key = "settings.auto_pause.options.off" },
  { value = "max", label_key = "settings.auto_pause.options.max" },
  { value = "full", label_key = "settings.auto_pause.options.full" },
]

[[setting]]
key = "mpv_options"
type = "string"
label_key = "settings.mpv_options.label"
description_key = "settings.mpv_options.description"
default = ""

[[setting]]
key = "run_as_systemd"
type = "bool"
label_key = "settings.run_as_systemd.label"
description_key = "settings.run_as_systemd.description"
default = false

[[setting]]
key = "cpu_quota"
type = "int"
label_key = "settings.cpu_quota.label"
default = 0
min = 0
max = 1600
step = 10
visible_when = { key = "run_as_systemd", values = ["true"] }

[[setting]]
key = "allowed_cpus"
type = "string"
label_key = "settings.allowed_cpus.label"
default = ""
visible_when = { key = "run_as_systemd", values = ["true"] }

[[setting]]
key = "memory_max"
type = "string"
label_key = "settings.memory_max.label"
default = ""
visible_when = { key = "run_as_systemd", values = ["true"] }

[[setting]]
key = "cpu_weight"
type = "int"
label_key = "settings.cpu_weight.label"
default = 0
min = 0
max = 10000
step = 10
visible_when = { key = "run_as_systemd", values = ["true"] }

[[setting]]
key = "nice"
type = "int"
label_key = "settings.nice.label"
default = 0
min = -20
max = 19
step = 1
visible_when = { key = "run_as_systemd", values = ["true"] }

[[service]]
id = "service"
entry = "service.luau"

[[panel]]
id = "picker"
entry = "panel.luau"
width = 1000
height = 592
placement = "floating"
position = "auto"

[[widget]]
id = "wallpaper"
entry = "widget.luau"

  [[widget.setting]]
  key = "glyph"
  type = "glyph"
  label_key = "settings.glyph.label"
  default = "photo"

[[shortcut]]
id = "shortcut"
entry = "shortcut.luau"
